<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0b10" />
    <title>DarkBear</title>
    <meta name="description" content="DarkBear IRC client — WeeChat relay + direct Orochi with realtime voice/video" />
    <link rel="manifest" href="/darkbear/manifest.json" />
    <link rel="icon" href="/darkbear/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/darkbear/favicon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DarkBear" />
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <!-- Sync script to prevent FOUC — reads theme from localStorage before first paint -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('darkbear_settings_v2');
          if (s) {
            var d = JSON.parse(s);
            if (d.theme) document.documentElement.setAttribute('data-theme', d.theme);
          } else {
            var v1 = localStorage.getItem('darkbear_settings_v1');
            if (v1) {
              var d1 = JSON.parse(v1);
              if (d1.theme) {
                var t = d1.theme === 'midnight' ? 'darkbear' : d1.theme;
                document.documentElement.setAttribute('data-theme', t);
              }
            }
          }
        } catch (e) {}
      })();
    </script>
    <!-- Asset-version cache bust — deploy.sh rewrites var v='...' on every deploy -->
    <script>
      (function () {
        try {
          var v = '2026-07-04-045925-darkbear-0d231a9';
          var k = 'darkbear_asset_version';
          if (localStorage.getItem(k) !== v) {
            localStorage.setItem(k, v);
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                rs.forEach(function (r) {
                  r.unregister();
                });
              });
            }
            if (
              window.location.pathname.indexOf('/darkbear') === 0 &&
              performance.navigation &&
              performance.navigation.type !== 1
            ) {
              setTimeout(function () {
                window.location.reload();
              }, 50);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
