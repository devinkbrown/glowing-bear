<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy — defense-in-depth backstop for the message-render
      and profile surfaces. No 'unsafe-inline' for scripts: the two first-party
      bootstrap scripts below are allowlisted by SHA-256 hash, so an injected
      inline handler (e.g. <img onerror=…>) can never execute. 'wasm-unsafe-eval'
      is required by the opcodec media codec (WebAssembly). Directives that are
      IGNORED in a <meta> CSP (frame-ancestors, X-Frame-Options) should also be
      set as nginx response headers on /darkbear/. Tuned so WS relays, media,
      uploads, and YouTube/Twitch embeds keep working.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-y7GJxeLo2t/duzld7J7nlJXHyyhQKM3/duNOwdaitV0=' 'sha256-oTMX2cYl8s1lltWWVp3jH/quPiDoVgb3Uuq9q1msNx0='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: blob:; font-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost https: wss: ws://localhost:* ws://127.0.0.1:*; worker-src 'self' blob:; child-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://clips.twitch.tv https://player.twitch.tv; manifest-src 'self'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0b10" />
    <title>DarkBear</title>
    <meta name="description" content="DarkBear IRC client — WeeChat relay + direct Onyx Server with realtime voice/video" />
    <!-- Preload ONLY the critical body weight (Inter 400). Other weights and
         JetBrains Mono fetch on first use. Same-origin, so CSP font-src 'self'
         covers it; crossorigin is still required on font preloads. -->
    <link
      rel="preload"
      href="%BASE_URL%fonts/inter-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DarkBear" />
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <!-- Sync script to prevent FOUC — reads theme from localStorage before first paint -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('darkbear_settings_v2');
          if (s) {
            var d = JSON.parse(s);
            if (d.theme) document.documentElement.setAttribute('data-theme', d.theme);
          } else {
            var v1 = localStorage.getItem('darkbear_settings_v1');
            if (v1) {
              var d1 = JSON.parse(v1);
              if (d1.theme) {
                var t = d1.theme === 'midnight' ? 'darkbear' : d1.theme;
                document.documentElement.setAttribute('data-theme', t);
              }
            }
          }
        } catch (e) {}
      })();
    </script>
    <!-- Deploy identity — stamp-release.mjs rewrites only the non-executed
         holder below. The stable executable script exposes that identity in
         the DOM, local storage, and the navigation URL so the service worker
         can select the exact release cache for each client. It never unregisters
         the worker, purges caches, or reloads stale HTML. -->
    <script type="text/plain" id="db-asset-version">var v = '2026-07-13-005653-darkbear-00b824a'</script>
    <script>
      (function () {
        try {
          var _h = document.getElementById('db-asset-version');
          var _m = _h && _h.textContent.match(/'([^']*)'/);
          var v = _m ? _m[1] : '';
          if (!v) return;
          document.documentElement.setAttribute('data-build', v);
          var k = 'darkbear_asset_version';
          if (localStorage.getItem(k) !== v) localStorage.setItem(k, v);
          if (window.location.pathname.indexOf('/darkbear') === 0) {
            var url = new URL(window.location.href);
            if (url.searchParams.get('dbv') !== v) {
              url.searchParams.set('dbv', v);
              window.history.replaceState(window.history.state, '', url.toString());
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
